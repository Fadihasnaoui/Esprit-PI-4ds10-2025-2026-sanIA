version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: sania_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sania_pass
      POSTGRES_DB: sania_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    container_name: sania_ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sania_backend
    restart: always
    volumes:
      - ./backend:/app
      - ./Data:/app/rag_data:ro
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:sania_pass@db:5432/sania_db
      - POSTGRES_SERVER=db
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3
      - RAG_DATA_DIR=/app/rag_data
    depends_on:
      - db
      - ollama

  frontend:
    build:
      context: ./website
      dockerfile: Dockerfile
    container_name: sania_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  ollama_data:
