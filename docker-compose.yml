services:
  # pgvector enabled (same PG 15 — required for RAG embeddings in Postgres)
  db:
    image: pgvector/pgvector:pg15
    container_name: sania_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sania_pass
      POSTGRES_DB: sania_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: sania_backend
    restart: always
    volumes:
      - ./backend:/app
      # Optional: mount a .txt or .pdf corpus (adjust filename + KNOWLEDGE_FILE_PATH)
      # - ./pdf_text.txt:/app/knowledge/corpus.txt:ro
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:sania_pass@db:5432/sania_db
      - POSTGRES_SERVER=db
      # - KNOWLEDGE_FILE_PATH=/app/knowledge/corpus.txt
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - RAG_INGEST_SECRET=${RAG_INGEST_SECRET:-}
    depends_on:
      - db

  frontend:
    build:
      context: ./website
      dockerfile: Dockerfile
    container_name: sania_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
